[project]
name = "cityflow"
version = "0.1.0"
description = "CityFlow Analytics: NYC Yellow Taxi data platform (mentorship project)"
authors = [
    { name = "Goncharov Mihail", email = "mihail.goncharov.dev@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "polars>=1.44.2",
    "pyarrow>=25.0.1",
]


[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
]
