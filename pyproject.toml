[project]
name = "cityflow"
version = "0.1.0"
description = "CityFlow Analytics: NYC Yellow Taxi data platform (mentorship project)"
authors = [
    { name = "Goncharov Mihail", email = "mihail.goncharov.dev@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "polars>=1.44.2",
    "pyarrow>=25.0.1",
]


[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
# The CI runner VM may not expose the CPU features required by standard Polars.
ci = [
    "polars[rtcompat]>=1.44.2",
]
dev = [
    "jupyter>=1.1.1",
    "mypy>=2.4.0",
    "pip-audit>=2.10.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.0",
]

[tool.ruff.lint]
# Add flake8-bandit security checks while retaining Ruff's default rules.
extend-select = ["S"]

[tool.ruff.lint.per-file-ignores]
# Pytest tests use assert statements for their checks.
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.13"
files = ["src/cityflow"]
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --cov=cityflow --cov-report=term-missing --cov-report=html:htmlcov --cov-report=xml:coverage.xml"

[tool.coverage.run]
branch = true
source = ["cityflow"]
relative_files = true

[tool.coverage.report]
show_missing = true
fail_under = 80
