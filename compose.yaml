# CityFlow — RustFS object storage (single-node / single-disk)
# Runtime: Docker Compose on laptop or CityFlow VM (Proxmox)
# Persistent data stays outside Git in CITYFLOW_DATA_DIR.
# RustFS SNSD is for development / learning, not high availability.
services:
  rustfs:
    image: ${RUSTFS_IMAGE:-rustfs/rustfs:latest}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

    # Default: localhost-only. For remote access, bind to the VM's Tailscale IP
    # through RUSTFS_BIND_IP in the private .env file (never use 0.0.0.0 casually).
    ports:
      - "${RUSTFS_BIND_IP:-127.0.0.1}:${RUSTFS_S3_PORT:-9000}:9000"
      - "${RUSTFS_BIND_IP:-127.0.0.1}:${RUSTFS_CONSOLE_PORT:-9001}:9001"

    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?Set RUSTFS_ACCESS_KEY in .env}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?Set RUSTFS_SECRET_KEY in .env}
      RUSTFS_ADDRESS: "0.0.0.0:9000"
      RUSTFS_CONSOLE_ADDRESS: "0.0.0.0:9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_OBS_LOGGER_LEVEL: "error"

    # The image runs as UID:GID 10001:10001. See setup instructions below.
    volumes:
      - "${CITYFLOW_DATA_DIR:-./.local/data}/rustfs:/data"

    # Required single-node storage path in the official RustFS image.
    command: ["/data"]

    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:9000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
