name: cityflow
version: "0.1.0"
config-version: 2
profile: cityflow

model-paths: ["models"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
test-paths: ["tests"]
clean-targets: ["target"]

vars:
  # Months of Silver to read, as YYYY-MM. Override: --vars '{source_months: ["2025-01", "2025-02"]}'
  source_months: ["2025-01"]

models:
  cityflow:
    staging:
      +materialized: view
    intermediate:
      +materialized: view
    marts:
      # Rebuilt from scratch on every build, so reruns never duplicate rows.
      +materialized: table
