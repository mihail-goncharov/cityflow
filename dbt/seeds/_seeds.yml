version: 2

seeds:
  - name: taxi_zone_lookup
    description: >
      Official TLC taxi zone lookup, committed unchanged (docs/gold.md
      section 4). One row per LocationID, 1 to 265. Zone names are not
      unique, so join on LocationID.
    config:
      column_types:
        LocationID: integer
        Borough: varchar
        Zone: varchar
        service_zone: varchar
