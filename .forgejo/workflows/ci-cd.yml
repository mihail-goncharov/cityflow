name: CityFlow CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  ci:
    runs-on: cityflow-ci
    steps:
      - name: Checkout repository
        uses: https://code.forgejo.org/actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Repository sanity checks
        shell: bash
        run: |
          set -euo pipefail
          test -f README.md
          test -d src
          echo 'Repository structure looks good.'

      - name: Gitleaks (changed commits)
        shell: bash
        env:
          SCAN_BASE: ${{ forgejo.event.pull_request.base.sha || forgejo.event.before }}
          SCAN_HEAD: ${{ forgejo.event.pull_request.head.sha || forgejo.sha }}
        run: |
          set -euo pipefail
          bash infra/scripts/install-gitleaks.sh "$RUNNER_TEMP/gitleaks-bin"
          export PATH="$RUNNER_TEMP/gitleaks-bin:$PATH"
          printf '%s\n' "$RUNNER_TEMP/gitleaks-bin" >> "$FORGEJO_PATH"
          bash infra/scripts/scan-secrets.sh changes "$SCAN_BASE" "$SCAN_HEAD"

      - name: Install Python dependencies (when Python project is present)
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f pyproject.toml ]; then
            echo 'Python project not added yet: skipping Python checks.'
            exit 0
          fi
          test -f uv.lock || { echo 'Missing uv.lock: run uv lock and commit it.'; exit 1; }
          curl -LsSf https://astral.sh/uv/install.sh | sh
          export PATH="$HOME/.local/bin:$PATH"
          printf '%s\n' "$HOME/.local/bin" >> "$FORGEJO_PATH"
          uv python install 3.13
          uv lock --check --python 3.13
          uv sync --locked --python 3.13 --group ci

      - name: Python dependency audit (pip-audit)
        if: ${{ hashFiles('pyproject.toml') != '' }}
        shell: bash
        run: bash infra/scripts/audit-dependencies.sh

      - name: Python quality gates (Ruff, mypy, pytest)
        if: ${{ hashFiles('pyproject.toml') != '' }}
        shell: bash
        env:
          POLARS_FORCE_PKG: compat
        run: |
          set -euo pipefail
          uv run --no-sync ruff check .
          uv run --no-sync mypy
          printf '## Coverage\n\n' >> "$FORGEJO_STEP_SUMMARY"
          uv run --no-sync pytest -q \
            --cov-report="markdown-append:$FORGEJO_STEP_SUMMARY"

      - name: Upload coverage reports
        if: ${{ always() }}
        uses: https://code.forgejo.org/actions/upload-artifact@v3
        with:
          name: coverage
          path: |
            coverage.xml
            htmlcov/
          if-no-files-found: warn
          retention-days: 14

  deploy:
    needs: ci
    if: ${{ forgejo.event_name == 'push' && forgejo.ref == 'refs/heads/main' && vars.ENABLE_DEPLOY == 'true' }}
    runs-on: cityflow-ci
    steps:
      - name: Deploy to CityFlow VM 110 over Tailscale SSH
        shell: bash
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_SSH_PRIVATE_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
          apt-get update -qq
          apt-get install -y --no-install-recommends openssh-client >/dev/null
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519_deploy"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519_deploy" "$HOME/.ssh/known_hosts"
          ssh -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -i "$HOME/.ssh/id_ed25519_deploy" \
            "alex@$DEPLOY_HOST" \
            'cd /home/alex/projects/cityflow && git fetch origin main && git merge --ff-only origin/main && bash infra/scripts/deploy.sh'
