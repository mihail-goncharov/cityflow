name: Gitleaks history

on:
  schedule:
    # Every Monday at 06:00 local time, including after DST changes.
    - cron: '0 6 * * 1'
      timezone: Europe/Chisinau
  workflow_dispatch:

jobs:
  gitleaks-history:
    runs-on: cityflow-ci
    timeout-minutes: 15
    steps:
      - name: Checkout all branches and tags
        uses: https://code.forgejo.org/actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Gitleaks (full Git history)
        shell: bash
        run: |
          set -euo pipefail
          bash infra/scripts/install-gitleaks.sh "$RUNNER_TEMP/gitleaks-bin"
          export PATH="$RUNNER_TEMP/gitleaks-bin:$PATH"
          bash infra/scripts/scan-secrets.sh history
