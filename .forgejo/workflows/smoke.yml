name: CityFlow CI Smoke Test

on:
  push:
    branches:
      - ci/smoke-test
  pull_request:
    branches:
      - main

jobs:
  smoke-test:
    name: Verify Forgejo Runner
    runs-on: cityflow-ci

    steps:
      - name: Check runner
        run: |
          echo "CityFlow CI Runner is working!"
          echo "Hostname: $(hostname)"
          echo "User: $(whoami)"
          echo "OS:"
          uname -a

      - name: Check basic tools
        run: |
          git --version
          echo "CI smoke test passed!"
